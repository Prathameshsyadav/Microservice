spring:
  application:
    name: Subject-Services
  datasource:
    url: jdbc:mysql://localhost:3306/microservices
    username: root
    password: root
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
  boot:
    admin:
      client:
        url:
        - http://localhost:1111

server:
  port: 8082

management:
  endpoints:
    web:
      exposure:
        include: '*'